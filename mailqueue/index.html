<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TD E-Mail Checker</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/svg+xml" href="img/TdMailQueue.svg">
</head>
<body>
<div class="container">
  <header>
    <div class="titleblock">
      <img src="img/TdMailQueue.svg" alt="TD E-Mail Checker" class="logo">
      <div>
        <h1>TD E-Mail Checker</h1>
        <p class="subtitle">ERP &ndash; Versandstatus der E-Mail-Warteschlange &middot; promted by Gassi - coded by AI</p>
      </div>
    </div>
    <div class="toolbar">
      <span id="badge" class="badge">&ndash;</span>
      <button id="refreshBtn" type="button">Aktualisieren</button>
    </div>
  </header>

  <div class="meta">
    <span id="status">&ndash;</span>
    <span class="sep">|</span>
    <span id="lastUpdated"></span>
    <span class="sep">|</span>
    <span>Auto-Refresh alle 30&nbsp;s</span>
    <span class="sep">|</span>
    <span class="legend"><span class="swatch"></span>rot&nbsp;=&nbsp;ErrorMsg</span>
    <span class="sep">|</span>
    <span class="legend"><span class="swatch swatch-warning"></span>gelb&nbsp;=&nbsp;Status&nbsp;!=&nbsp;0</span>
  </div>

  <div id="errorBox" class="error hidden"></div>
  <div id="emptyBox" class="empty hidden">Queue ist leer &ndash; keine ausstehenden E-Mails.</div>

  <div id="tableWrap" class="tablewrap hidden">
    <table id="queueTable">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
